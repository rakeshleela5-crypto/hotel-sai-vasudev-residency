<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a111e" />
      <stop offset="50%" stop-color="#141f32" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8323" />
      <stop offset="100%" stop-color="#fdf0b8" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Crest Background Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 2" />

  <!-- Monogram SV -->
  <g filter="url(#goldGlow)">
    <!-- Crown / Temple Kalash Crest Symbol -->
    <path d="M64 22 L69 32 L78 30 L73 38 L82 43 L64 40 L46 43 L55 38 L50 30 L59 32 Z" fill="url(#goldGrad)" />
    
    <!-- Monogram Letters "SV" -->
    <text x="64" y="86" 
          font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="1"
          fill="url(#goldGrad)" 
          text-anchor="middle"
          dominant-baseline="middle">
      SV
    </text>

    <!-- Star / Flourish Under Monogram -->
    <circle cx="64" cy="106" r="3" fill="url(#goldGrad)" />
    <path d="M42 106 Q53 104 60 106 M68 106 Q75 104 86 106" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>
</svg>